name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contracts
      - run: npm run build

  browser-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests scripts modal_app.py
      - run: mypy app tests scripts
      - run: pytest
      - run: python scripts/generate_openapi.py --check
      - run: python -m py_compile modal_app.py

  edge-and-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Edge tests import npm:zod, so node_modules must exist before Deno
      # resolves the function's npm: dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm run test:edge
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: npm run generate:database
      - run: git diff --exit-code -- src/generated/database.types.ts

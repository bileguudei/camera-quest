name: ci

on:
  pull_request:
  push:
    branches: [main]

# A superseded push stops paying for the run it replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    # Every job is bounded. GitHub's default is six hours, which is long enough
    # for a stalled network step to burn a day of minutes before anyone notices.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The lock-file guard compares against origin/main to tell a real
          # dependency change from an accidentally rewritten lock file.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check package-lock.json
        run: node scripts/check-lockfile.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:contracts
      - run: npm run build

  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The lock-file guard compares against origin/main to tell a real
          # dependency change from an accidentally rewritten lock file.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check package-lock.json
        run: node scripts/check-lockfile.mjs
      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Deliberately not `--with-deps`: that runs apt-get, and the runner's
      # Ubuntu mirrors can hang for hours with no output. The hosted image
      # already ships Chromium's system libraries, and if one were ever missing
      # the e2e run below fails immediately instead of stalling.
      - name: Install Chromium
        run: npx playwright install chromium
        timeout-minutes: 6

      - run: npm run test:e2e
        timeout-minutes: 10

  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vision-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests scripts modal_app.py
      - run: mypy app tests scripts
      - run: pytest
      - run: python scripts/generate_openapi.py --check
      - run: python -m py_compile modal_app.py

  edge-and-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Edge tests import npm:zod, so node_modules must exist before Deno
      # resolves the function's npm: dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check package-lock.json
        run: node scripts/check-lockfile.mjs
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm run test:edge
      - name: Start local Supabase
        run: supabase start
        timeout-minutes: 10
      - run: supabase db reset
      - run: supabase test db
      - run: npm run generate:database
      - run: git diff --exit-code -- src/generated/database.types.ts

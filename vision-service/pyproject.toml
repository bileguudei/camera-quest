[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "camera-quest-vision"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.116,<1",
  "google-genai>=1.0,<2",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.11,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sentry-sdk[fastapi]>=2.35,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
modal = [
  # routing_region support is required by modal_app.py.
  "modal>=1.4.3,<2",
  "mediapipe>=0.10.21,<0.11",
  "onnx==1.22.0",
  "onnx-graphsurgeon==0.6.1",
  "onnxruntime-gpu==1.26.0",
  "onnxsim==0.7.3",
  "polygraphy==0.53.4",
  "rfdetr==1.9.2",
  "torch==2.9.1",
  "torchvision==0.24.1",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["modal_app.py"]
